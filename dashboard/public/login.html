<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <title>Sign in · PlayPulse</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login">
    <img class="login-logo" src="icon.svg" alt="" width="72" height="72">
    <h1>PlayPulse</h1>
    <p class="login-intro">Sign in to manage wristbands</p>

    <form id="login-form">
      <label class="field">Staff password
        <span class="password-box">
          <input id="password" name="password" type="password" required autofocus
                 autocomplete="current-password" autocapitalize="off" spellcheck="false">
          <button type="button" id="reveal" class="reveal" aria-pressed="false">Show</button>
        </span>
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button id="login-submit" type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </main>
  <script src="login.js" type="module"></script>
</body>
</html>
